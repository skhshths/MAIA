<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}MAIA{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='images/maia.ico') }}" type="image/x-icon" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/maia.css') }}" />
  <script>
    // Set the theme before the page paints so it doesn't flash
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('maia-theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>

  <header class="topbar">
    <a href="/" class="brand">MAIA<span class="brand-sub"> / Medical AI Assistant</span></a>
    <nav>
      <a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>Scan</a>
      <a href="/info" {% if request.path == '/info' %}aria-current="page"{% endif %}>About</a>
      <a href="/dashboard" {% if request.path in ['/dashboard', '/login'] %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="https://github.com/oliverbarnet/MAIA" target="_blank" rel="noopener noreferrer">GitHub</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">dark</button>
    </nav>
  </header>

  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <span>&copy; 2025 MAIA Medical AI Interface &middot; v{{ version }}</span>
    <span class="footer-note">A study tool, not a diagnosis. Always ask a clinician.</span>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      function label() {
        btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      }
      btn.addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('maia-theme', next); } catch (e) {}
        label();
      });
      label();
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
